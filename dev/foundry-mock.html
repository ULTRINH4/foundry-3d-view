<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foundry 3D View – mock Foundry harness</title>
  <link rel="stylesheet" href="../styles/foundry-3d-view.css">
  <style>
    html, body { margin: 0; height: 100%; background: #222; color: #eee; font-family: system-ui, sans-serif; }
    #board { position: fixed; inset: 0; background: repeating-linear-gradient(45deg, #2b2b2b 0 20px, #303030 20px 40px); }
    #controls { position: fixed; left: 8px; top: 8px; z-index: 5; display: flex; flex-direction: column; gap: 4px; }
    #status { position: fixed; left: 8px; bottom: 8px; z-index: 5; font-size: 12px; background: #000a; padding: 6px; max-width: 60vw; }
  </style>
</head>
<body>
  <canvas id="board"></canvas>
  <div id="controls"></div>
  <div id="status">mock Foundry harness: the real module code runs against fake Foundry globals</div>
  <script type="module" src="./foundry-mock-page.mjs"></script>
</body>
</html>
